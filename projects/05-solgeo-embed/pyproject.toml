[project]
name = "solgeo-embed"
version = "0.1.0"
description = "Low-label embedding and prototype-classification foundations for Earth observation"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "ty>=0.0.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
