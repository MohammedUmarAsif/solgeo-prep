[project]
name = "solgeo-prep"
version = "0.2.0a1"
description = "Reusable, provenance-first Earth-observation preparation and change evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dask[array]>=2025.1",
  "fsspec>=2024.10",
  "folium>=0.17",
  "geopandas>=1.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "odc-stac>=0.5",
  "pandas>=2.2",
  "planetary-computer>=1.0",
  "plotly>=5.24",
  "pystac-client>=0.8",
  "pyproj>=3.7",
  "rasterio>=1.4",
  "rioxarray>=0.17",
  "scikit-learn>=1.5",
  "shapely>=2.0",
  "xarray>=2024.10",
  "zarr>=3.0",
  "pyyaml>=6.0.3",
]

[project.scripts]
solgeo-prep = "solgeo_prep.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
notebook = [
  "geolibre>=0.1",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyterlab>=4.3",
  "tqdm>=4.66",
]
gis = [
  "duckdb>=1.1",
  "leafmap>=0.43",
  "mapclassify>=2.8",
  "pyogrio>=0.10",
  "pyarrow>=18.0",
  "stackstac>=0.5",
]
ml = [
  "torchgeo>=0.9",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "ty>=0.0.1",
]
all = [
  "geolibre>=0.1",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyterlab>=4.3",
  "tqdm>=4.66",
  "duckdb>=1.1",
  "leafmap>=0.43",
  "mapclassify>=2.8",
  "pyogrio>=0.10",
  "pyarrow>=18.0",
  "stackstac>=0.5",
  "pytest>=8.3",
  "ruff>=0.9",
  "ty>=0.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "ty>=0.0.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
